<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">

<style>

<div id="w"><canvas id="c" width="840" height="1520"></canvas>
<div id="ov"><h2>ドリンクマージ</h2><p>触れた所から左右にスワイプして、指を離すと飛ぶよ。<br>★グラスはどれにでもくっついて進化！連鎖でボーナス。<br>同じグラスをぶつけると進化！<br>注文書のドリンクを作って納品しよう。</p><button id="b1">スタート</button><button id="b2" class="s" style="display:none">コンティニュー（ランク4以下を消す）</button></div>

<script>
const cv=document.getElementById('c'),X=cv.getContext('2d'),W=420,H=760;X.scale(2,2);
const L=34,R=386,T=212,B=726,DL=650,LX=210,LY=702;
const wf=y=>Math.min(1,Math.max(0,(y-192)/538)),lw=y=>90-74*wf(y),rw=y=>330+74*wf(y);let lx=210,curW=false,nxtW=false,combo=0,comboT=0;

let AC,mg,bg,sf,nb,mute=false,nextT=0,stp=0;
function ac(){if(AC){if(AC.state!='running')AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=mute?0:.6;mg.connect(AC.destination);
 bg=AC.createGain();bg.gain.value=.22;bg.connect(mg);sf=AC.createGain();sf.gain.value=.9;sf.connect(mg);
 nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

const mf=m=>440*2**((m-69)/12);
const MEL=[72,0,76,79,0,76,72,0,69,0,72,76,0,72,69,0,65,0,69,72,0,69,65,0,67,71,74,0,71,74,79,0],BAS=[48,45,41,43];

  if(m)tone(mf(m),sd*1.6,'square',.09,0,t,bg);

  if(a.k==b.k){a.dead=b.dead=true;const x=(a.x+b.x)/2,y=(a.y+b.y)/2;
   if(a.k==11){burst(x,y,'#9fd8ff',40,420);burst(x,y,'#ffe04a',30,300);coins+=500;score+=500;ftx(x,y,'+500');S.big();shake=14}
   else{const n=addGlass(a.k+1,x,y,(a.vx+b.vx)/2,(a.vy+b.vy)/2,a.armed||b.armed);n.pop=1;gl.pop();add.push(n);score+=a.k*10;burst(x,y,COL[a.k],16);S.merge(a.k);cmb(x,y,a.k);shake=Math.max(shake,3+a.k*.5)}
   continue}

function update(dt){
 comboT-=dt;if(comboT<=0)combo=0;for(let i=0;i<3;i++)step(dt/3);

 if(danger&&gl.some(g=>g.t>2)){over=true;run=false;S.over();showOv()}
 if(!order.done){const g=gl.find(g=>g.k==order.k&&!g.wild);if(g){gl=gl.filter(h=>h!==g);fl.push({k:g.k,r:g.r,x0:g.x,y0:g.y,t:0});order.done=true;S.deliver()}}
 for(const f of fl){f.t+=dt*1.7;if(!f.fin&&f.t>=1){f.fin=true;coins+=order.rw;score+=order.rw;done++;checkT=.9;pulse=1;ftx(210,170,'+'+order.rw,'#ffe04a');burst(210,118,'#ffe04a',22);for(let i=0;i<4;i++)setTimeout(S.tick,i*70)}}
 fl=fl.filter(f=>f.t<1.05);
 if(checkT>0){checkT-=dt;if(checkT<=0)newOrder()}
 for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+200*dt;p.l-=dt}pt=pt.filter(p=>p.l>0);

 for(const [x,s] of [[0,1],[420,-1]]){for(let i=0;i<6;i++){c.fillStyle=i%2?'#fff':'#e24d4d';c.beginPath();c.moveTo(x,330+i*36);c.lineTo(x+34*s,350+i*36);c.lineTo(x+34*s,384+i*36);c.lineTo(x,366+i*36);c.fill()}}
 c.fillStyle='#fffaf0';c.fillRect(0,0,W,52);c.fillStyle='#e8503e';for(let x=0;x<W;x+=60)c.fillRect(x,0,30,52);

 c.strokeStyle='#b97a3a';c.lineWidth=3;c.stroke();c.lineWidth=2;c.strokeStyle='#c98b4a';for(let i=1;i<4;i++){c.beginPath();c.moveTo(tl+(tr-tl)*i/4,ty);c.lineTo(bl+(br-bl)*i/4,by);c.stroke()}
 const px=(u,v)=>tl+(tr-tl)*u+((bl-tl)+((br-tr)-(bl-tl))*u)*v;for(let i=0;i<260;i++){const u=Math.random(),v=Math.random()*.95,v2=v+.04+Math.random()*.18;c.strokeStyle=Math.random()<.55?'rgba(120,70,20,.2)':'rgba(255,235,180,.22)';c.lineWidth=.7+Math.random()*1.5;c.beginPath();c.moveTo(px(u,v),ty+(by-ty)*v);c.lineTo(px(u,Math.min(1,v2)),ty+(by-ty)*Math.min(1,v2));c.stroke()}for(let i=0;i<5;i++){const u=.1+Math.random()*.8,v=.1+Math.random()*.8;c.strokeStyle='rgba(110,60,15,.35)';c.lineWidth=1.5;for(let j=1;j<4;j++){c.beginPath();c.ellipse(px(u,v),ty+(by-ty)*v,j*3,j*1.6,0,0,6.3);c.stroke()}}c.fillStyle='#ffffff26';c.beginPath();c.moveTo(tl,ty);c.lineTo(tl+50,ty);c.lineTo(bl+90,by);c.lineTo(bl,by);c.fill()})();
const SH=[{p:[[-.2,.8],[.7,.62]],lv:0},{p:[[-.9,.85],[.7,.8]],lv:-.6},{p:[[-1.4,.55],[.7,.5]],lv:-1.1},{p:[[-.7,1.05],[.2,.06]],lv:-.5,st:1},{p:[[-.6,.7],[-.15,1],[.35,.95],[.65,.45]],lv:-.3},{p:[[-1.3,.8],[-.9,.5],[-.4,.45],[0,.85],[.5,.8],[.7,.4]],lv:-1},{p:[[-1.3,.5],[-.2,.42],[.2,.1]],lv:-1,st:1},{p:[[-.4,1.1],[0,1.02],[.4,.78],[.68,.4]],lv:-.2},{p:[[-1.2,.95],[-.5,.7],[.3,.55],[.7,.7]],lv:-.9},{p:[[-1,.95],[-.4,1.05],[.2,.75],[.4,.3]],lv:-.7,st:1},{p:[[-1,1],[-.3,1.05],[.25,.7],[.45,.25]],lv:-.7,st:1}];

 c.save();c.globalAlpha=al;c.fillStyle='rgba(60,30,0,.25)';c.beginPath();c.ellipse(x+r*.1,y+.72*r,r*.95,r*.27,0,0,6.3);c.fill();
