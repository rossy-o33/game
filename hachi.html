let AC,bg,se,NB,nt=0,step=0,lap={},trackGroup=-1;
function initA(){if(AC!==undefined)return;try{AC=new(window.AudioContext||webkitAudioContext)()}catch(e){AC=null;return}
 bg=AC.createGain();se=AC.createGain();bg.connect(AC.destination);se.connect(AC.destination);setV();
 const l=AC.sampleRate;NB=AC.createBuffer(1,l,l);const d=NB.getChannelData(0);for(let i=0;i<l;i++)d[i]=Math.random()*2-1;
 nt=AC.currentTime+.1;setInterval(sched,40)}
function setV(){if(AC){bg.gain.value=bv*.6;se.gain.value=sv}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function osc(t,f,d,ty,v,dest,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function nz(t,d,v,hp,dest){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.05)}
function pad(t,ns,d,cut){const f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=cut;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.045,t+.15);g.gain.setValueAtTime(.045,t+d-.15);g.gain.linearRampToValueAtTime(.0001,t+d);f.connect(g);g.connect(bg);
 ns.forEach(n=>[-9,9].forEach(c=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(n);o.detune.value=c;o.connect(f);o.start(t);o.stop(t+d+.05)}))}
/* 10ステージ単位でテーマを固定し、境目で別の曲へ切り替える */
const SC=[0,2,4,7,9],CT=[[0,4,7,11],[0,3,7,10],[0,4,7,10]],

ARPS=[[0,1,2,3,2,1,3,2],[0,2,1,3,0,2,3,1],[3,2,1,0,1,2,3,2],[0,3,1,2,3,1,2,0],[1,0,2,3,2,0,3,1],[2,0,3,1,0,2,1,3],[3,1,0,2,1,3,2,0],[0,1,3,2,0,2,1,3]],

function newLap(){const group=Math.floor((st-1)/10),theme=THEMES[group%10],R=rng(0x484342+group*104729);trackGroup=group;const key=theme.key,pr=PR[theme.pr];
 lap={sp:60/theme.bpm/4,key,chs:pr.map(([r,t])=>CT[t].map(o=>48+key+r+o)),kick:KICKS[theme.k],arp:ARPS[theme.a],cut:theme.cut,lead:theme.lead,arpWave:theme.arp,
