function nz(t,d,v,hp,dest){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.05)}
/* 短いコードのスタブ(長く伸ばさない・音量は小さめ) */
function stab(t,ns,d,cut){const f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=cut;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.014,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);f.connect(g);g.connect(bg);
 ns.forEach(n=>[-8,8].forEach(c=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(n);o.detune.value=c;o.connect(f);o.start(t);o.stop(t+d+.05)}))}
/* 32小節ごとにキー・コード進行・テンポ・アルペジオ・リズムを作り直す(毎周ちがう曲になる) */
const SC=[0,2,4,7,9],CT=[[0,4,7,11],[0,3,7,10],[0,4,7,10]],
PR=[[[5,0],[7,2],[4,1],[9,1]],[[9,1],[5,0],[0,0],[7,2]],[[0,0],[4,1],[5,0],[7,2]],[[2,1],[7,2],[0,0],[9,1]]],
AP=[[0,1,2,3,2,1,3,2,0,2,1,3,2,3,1,2],[0,2,1,3,0,2,3,1,2,0,3,1,2,3,0,1],[3,2,1,0,1,2,3,2,3,1,2,0,2,1,3,1],[0,1,2,1,3,2,1,2,0,1,2,3,2,1,0,1]],
BP=[[0,6,8,14],[0,3,6,8,11,14],[0,2,6,8,10,14],[0,4,8,12]],PS=[[2,6,10,14],[0,3,8,11],[4,10,12]];
const pick=a=>a[Math.random()*a.length|0];
function newLap(){const key=pick([0,2,-2,3,-3,5,-5]),pr=pick(PR);
 lap={sp:60/pick([124,132,140])/4,key,chs:pr.map(([r,t])=>CT[t].map(o=>48+key+r+o)),kick:pick([[0,10],[0,6,10],[0,8],[0,3,10]]),
  ap:pick(AP),bp:pick(BP),ps:pick(PS),cut:pick([1400,2000,2800]),hi:pick([0,1]),
  mel:[0,1,2,3].map(()=>[0,3,6,8,10,12,14].map(()=>Math.random()<.5?SC[Math.random()*5|0]+(Math.random()<.3?12:0):null))};
 if(dl)dl.delayTime.value=lap.sp*3}
function sched(){if(!AC)return;while(nt<AC.currentTime+.25){const s=step%512,bar=s>>4,sb=s&15,sec=bar>>3;
 if(s==0)newLap();const c=lap.chs[(bar>>1)&3],sp=lap.sp,fill=bar>=30;
 /* ドラム */
 if((sec==1||sec==2||fill||(sec==0&&bar>=4))&&lap.kick.includes(sb))osc(nt,140,.25,'sine',.5,bg,40);
 if((sec==1||sec==2)&&sb==8)nz(nt,.18,.22,1500,bg);
 if(fill&&sb%2==0)nz(nt,.09,.1+.01*sb,2000,bg);
 if(sec==2?true:sec==1?sb%2==0:sb%4==2)nz(nt,.04,sb%4==2?.07:.04,7000,bg);
 /* ベースライン */
 if(lap.bp.includes(sb))osc(nt,mf(c[0]-12+(sb==8?12:0)),sp*2.4,'sine',sec==3?.22:.3,bg);
 /* 上物アルペジオ(全編で鳴る) */
 const an=c[lap.ap[sb]]+12+((sb%4==3||(lap.hi&&sb>=8))?12:0),av=sec==0?.07:sec==3?.08:.095;
 osc(nt,mf(an),.16,'triangle',av,ar);osc(nt,mf(an),.11,'square',av*.35,ar);
 /* 短いコードスタブ */
 if(lap.ps.includes(sb))stab(nt,c.map(n=>n+12),sp*2.2,lap.cut);
 /* リード */
 if(sec>=2){const i=[0,3,6,8,10,12,14].indexOf(sb),v=i<0?null:lap.mel[bar&3][i];if(v!=null)osc(nt,mf(72+lap.key+v),sp*2.6,'triangle',sec==3?.05:.08,bg)}
 step++;nt+=sp}}
function S(k){if(!AC)return;const t=AC.currentTime;
 if(k=='sel')osc(t,880,.12,'sine',.3,se,1320);
 else if(k=='pop')osc(t,520+Math.random()*120,.09,'sine',.22,se,900);
 else if(k=='full')osc(t,300,.25,'sine',.25,se,220);
 else if(k=='win')[523,659,784,1047].forEach((f,i)=>osc(t+i*.11,f,.35,'triangle',.3,se))}

rs();requestAnimationFrame(loop);
