</div></div>
<div id="top"></div><dialog id="dz"></dialog><dialog id="dg"><b>寿司将棋のルール</b><br>
・手番は1つだけ：移動／注文／炙り／パス（3回まで）<br>
・<b>直接取り</b>：敵駒のマスへ動くと取れる（たこは不可）<br>
・<b>挟み取り</b>：動かした駒と味方で敵を縦か横に挟むと取れる。大トロとウニは挟まれない<br>
・取った駒の値段が所持金とスコアに入る（炙り駒は+¥200）<br>
・注文：木札を選び自陣2列の空きマスへ置く（挟みは起きない）<br>
・炙り：¥300で駒を強化（大トロ以外・1回まで）<br>
・<b>相手の大トロを直接取れば勝ち</b>。合計60手でスコア勝負<br><br>
<button class="wb" onclick="dg.close()">閉じる</button></dialog>
<script>
const $=s=>document.querySelector(s),dg=$('#dg');
const PR={toro:2000,tamago:250,aji:300,ika:500,ebi:500,tako:600,salmon:800,uni:1000};
const NM={toro:'大トロ',tamago:'たまご',aji:'あじ',ika:'いか',ebi:'えび',tako:'たこ',salmon:'サーモン',uni:'ウニ'};
const OT=['aji','ebi','ika','tamago','tako','salmon','uni'];
const DS={toro:'全8方向に1マス。挟まれても取られない。直接取られたら負け！',tamago:'前・横に1マス',aji:'斜めに1マス＋前2マスへジャンプ（ジャンプでは取れない）',ika:'縦横に1マス＋隣の味方と入れ替わり',ebi:'前・横に1マス＋後ろ斜め2マスへジャンプ',tako:'全8方向に1マス。直接取り不可。周嘲8マスの味方を挟み取りから守る',salmon:'縦横に最大2マス',uni:'斜めに最大2マス。挟まれても取られない'};
const AB={tamago:'後ろと前斜めにも進める',aji:'斜め最大2マス＋ジャンプでも取れる',ika:'縦横最大2マス・8方向で入替',ebi:'前斜め2マスにも跳べる',tako:'直接取りができるようになる',salmon:'縦横最大3マス＋斜め1',uni:'斜め最大3マス＋縦横1'};
const O4=[[1,0],[-1,0],[0,1],[0,-1]],D4=[[1,1],[1,-1],[-1,1],[-1,-1]],A8=O4.concat(D4),FW=[[1,0],[0,1],[0,-1]];
function spec(t,a){switch(t){
case'toro':return{st:A8,cap:1};
case'tamago':return{st:a?FW.concat([[-1,0],[1,1],[1,-1]]):FW,cap:1};
case'aji':return a?{sl:[D4,2],jp:[[2,0]],cap:1}:{st:D4,jp:[[2,0]],jn:1,cap:1};
case'ika':return a?{sl:[O4,2],sw:A8,cap:1}:{st:O4,sw:O4,cap:1};
case'ebi':return{st:FW,jp:a?[[-2,2],[-2,-2],[2,2],[2,-2]]:[[-2,2],[-2,-2]],cap:1};
case'tako':return{st:A8,cap:a};
case'salmon':return a?{sl:[O4,3],st:D4,cap:1}:{sl:[O4,2],cap:1};
case'uni':return a?{sl:[D4,3],st:O4,cap:1}:{sl:[D4,2],cap:1}}}
function gen(B,x,y){const c=B[y][x],fv=FV[c.p],lv=LV[c.p],sp=spec(c.t,c.a),R=[];
const at=(f,s)=>{const X=x+f*fv[0]+s*lv[0],Y=y+f*fv[1]+s*lv[1];return X>=0&&X<W&&Y>=0&&Y<Hh?[X,Y]:null};
const tr=(f,s,j)=>{const q=at(f,s);if(!q)return 0;const o=B[q[1]][q[0]];
if(!o){R.push({x:q[0],y:q[1],j});return 1}
if(o.p!=c.p&&sp.cap&&!(j&&sp.jn))R.push({x:q[0],y:q[1],j});return 0};
(sp.st||[]).forEach(v=>tr(v[0],v[1]));
(sp.jp||[]).forEach(v=>tr(v[0],v[1],1));
if(sp.sl)sp.sl[0].forEach(v=>{for(let k=1;k<=sp.sl[1];k++)if(!tr(v[0]*k,v[1]*k))break});
(sp.sw||[]).forEach(v=>{const q=at(v[0],v[1]);if(q){const o=B[q[1]][q[0]];if(o&&o.p==c.p)R.push({x:q[0],y:q[1],sw:1})}});
return R}
function sand(B,x,y,p){const L=[];O4.forEach(([a,b])=>{const e=B[y+b]?.[x+a],m=B[y+2*b]?.[x+2*a];
if(e&&e.p!=p&&m&&m.p==p&&e.t!='toro'&&e.t!='uni'&&!A8.some(([u,w])=>B[y+b+w]?.[x+a+u]?.t=='tako'&&B[y+b+w][x+a+u].p==e.p))L.push([x+a,y+b])});return L}
function doMove(S,fx,fy,m){const B=S.B,c=B[fy][fx],p=c.p,R={cap:[],gain:0,win:0};
if(m.sw){const o=B[m.y][m.x];B[m.y][m.x]=c;B[fy][fx]=o;return R}
const o=B[m.y][m.x];if(o){R.cap.push(o);if(o.t=='toro'){R.win=1;R.k=o.p}}
B[m.y][m.x]=c;B[fy][fx]=null;
if(!R.win)sand(B,m.x,m.y,p).forEach(([X,Y])=>{R.cap.push(B[Y][X]);B[Y][X]=null});
R.cap.forEach(o=>R.gain+=PR[o.t]+(o.a?200:0));S.pl[p].m+=R.gain;S.pl[p].s+=R.gain;
if(R.win){const k=R.k;B.forEach(r=>r.forEach((c,i)=>{if(c&&c.p==k)r[i]=null}));S.pl[p].m+=S.pl[k].m;S.pl[k].m=0;S.pl[k].dead=1}
return R}
function act(T,a){const p=T.turn;let r={cap:[],win:0,gain:0};
if(a.k=='m')r=doMove(T,a.fx,a.fy,a.m);
else if(a.k=='o'){T.B[a.y][a.x]={t:a.t,p};T.pl[p].m-=PR[a.t]}
else if(a.k=='a'){T.B[a.y][a.x].a=1;T.pl[p].m-=300}
else T.pl[p].pass--;
return r}
function acts(T,p,mo){const A=[],q=T.pl[p];
for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){const c=T.B[y][x];if(!c||c.p!=p)continue;
gen(T.B,x,y).forEach(m=>A.push({k:'m',fx:x,fy:y,m}));
if(!mo&&!c.a&&c.t!='toro'&&q.m>=300)A.push({k:'a',x,y})}
if(!mo){for(const t of OT)if(q.m>=PR[t])for(let y=0;y<Hh;y++)for(let x=0;x<W;x++)if(!T.B[y][x]&&zone(p,x,y))A.push({k:'o',t,x,y});
if(q.pass>0)A.push({k:'p'})}
return A}
/* ---- state ---- */
let S,sel,ord,hist=[],AC;
function snd(f,d=.14){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function burst(){try{AC=AC||new AudioContext();const n=AC.sampleRate*.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800;g.gain.value=.25;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const MD=[[0,2,4,7,9],[0,2,5,7,9],[0,1,5,7,8]];let BG=0,bgT,bgM;
function bgm(on){BG=on;clearTimeout(bgT);$('#bm').textContent=on?'🔊':'🔇';if(!on)return;
try{AC=AC||new AudioContext();AC.resume&&AC.resume();
if(!bgM){bgM=AC.createGain();bgM.gain.value=.35;const d=AC.createDelay(),f=AC.createGain(),lp=AC.createBiquadFilter();d.delayTime.value=.42;f.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;bgM.connect(AC.destination);bgM.connect(d);d.connect(lp);lp.connect(f);f.connect(d);lp.connect(AC.destination)}}catch(e){return}
let root=50,md=MD[0],i=7,n=0;
const mf=m=>440*Math.pow(2,(m-69)/12),note=k=>root+md[((k%5)+5)%5]+12*Math.floor(k/5);
const tone=(m,t,dur,vol,type)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(mf(m)*(type=='triangle'?1.012:1),t);if(type=='triangle')o.frequency.exponentialRampToValueAtTime(mf(m),t+.08);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(type=='sine'?dur*.3:.01));g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(bgM);o.start(t);o.stop(t+dur+.05)};
const dr=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(bgM);o.start(t);o.stop(t+.45)};
const step=()=>{if(!BG)return;const t=AC.currentTime+.05,r=Math.random;
if(n%64==0){root=[50,52,55,57][r()*4|0];md=MD[r()*3|0];i=7}
if(n%16==0){tone(root-24,t,3.4,.2,'sine');tone(root-17,t,3.4,.1,'sine')}
if(n%16==0||(n%16==8&&r()<.5))dr(t);
if(r()<.6){i=Math.max(3,Math.min(13,i+[-2,-1,-1,0,1,1,2][r()*7|0]));tone(note(i),t,1.7,.16,'triangle');if(r()<.14)for(let k=1;k<4;k++)tone(note(i+k),t+k*.07,1.2,.1,'triangle')}
if(n%32==12&&r()<.6)tone(note(i+5),t,4.2,.07,'sine');
n++;bgT=setTimeout(step,420+r()*50)};
step()}
function save(){try{localStorage.setItem('ss',JSON.stringify({S,m:$('#mode').value,hist:hist.slice(-10)}))}catch(e){}}
