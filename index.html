<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミニゲーム集</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1d2433;
    --sub: #5d6575;
    --card: #ffffff;
    --line: #ded8c8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 20px 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 7vw, 60px);
    font-weight: 900;
    letter-spacing: .02em;
    line-height: 1.1;
  }
  header p { margin: 12px 0 0; color: var(--sub); font-size: 15px; }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(29, 36, 51, .16);
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card:active { transform: scale(.98); }

  .shot {
    position: relative;
    aspect-ratio: 3 / 4;
    background: linear-gradient(160deg, var(--accent), var(--accent2, #1d2433));
    overflow: hidden;
  }
  .shot img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .shot .fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    color: #fff;
    font-size: 26px;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .play {
    position: absolute; right: 12px; bottom: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .info { padding: 14px 16px 16px; }
  .info h2 { margin: 0; font-size: 18px; font-weight: 800; }
  .info p { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--sub); }

  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 20px 40px; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    header { padding-top: 32px; }
    .info { padding: 10px 12px 14px; }
    .info h2 { font-size: 15px; }
    .info p { font-size: 12px; }
    .play { font-size: 12px; padding: 6px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>ミニゲーム集</h1>
  <p>遊びたいゲームをタップするとスタートします</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>© ミニゲーム集</footer>

<script>
/* ============================================================
   ゲームを追加するときは、下の GAMES に1ブロック足すだけ。
   ------------------------------------------------------------
   title : ゲーム名
   desc  : 一言説明
   url   : ゲームのHTMLファイル
   thumb : スクショ画像のパス(thumbs フォルダに入れる)
           画像がまだ無い場合は空欄 "" でもOK(色カードで表示)
   color : カードのテーマ色(#RRGGBB)
   color2: グラデーションの2色目(省略可)
   ============================================================ */
const GAMES = [
  {
    title: "PIG STAR RIDER",
    desc:  "ぶたでかけぬける、スピードアクション",
    url:   "buta.html",
    thumb: "thumbs/buta.jpg",
    color: "#ef6f9a",
    color2:"#6a3cc2"
  },
  {
    title: "モンキードッグ",
    desc:  "猿と犬が戦う、全10ステージの縦画面バトル",
    url:   "monkey-dog.html",
    thumb: "thumbs/monkey-dog.jpg",
    color: "#e08a1e",
    color2:"#2f7d4f"
  },
  {
    title: "たまごゲーム",
    desc:  "ブロックをおいて、コンボを作ろう！",
    url:   "neon-blocks.html",
    thumb: "thumbs/tamago.jpg",
    color: "#2a5bd7",
    color2:"#e8603c"
  },
  {
    title: "ドリンクマージ",
    desc:  "グラスを飛ばして合体、注文のドリンクを作ろう",
    url:   "glass.html",
    thumb: "thumbs/glass.jpg",
    color: "#1fa6b8",
    color2:"#2a5bd7"
  }
  {
    title: "たまごゲーム",
    desc:  "たまごを使った、手軽に遊べるミニゲーム",
    url:   "tamago.html",
    thumb: "thumbs/tamago.jpg",
    color: "#f2b705",
    color2:"#e8603c"
  },
  /* ↑ 新しいゲームは、上の } のうしろに , をつけて { ... } を追加 */
];

const grid = document.getElementById("grid");

GAMES.forEach(g => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = g.url;
  a.style.setProperty("--accent", g.color || "#2a5bd7");
  if (g.color2) a.style.setProperty("--accent2", g.color2);

  const shot = document.createElement("div");
  shot.className = "shot";

  // 画像が無い・読み込めない場合は、タイトル入りの色カードを表示
  const fb = document.createElement("div");
  fb.className = "fallback";
  fb.textContent = g.title;
  shot.appendChild(fb);

  if (g.thumb) {
    const img = new Image();
    img.alt = g.title + " のスクリーンショット";
    img.loading = "lazy";
    img.onload = () => { fb.remove(); shot.insertBefore(img, shot.firstChild); };
    img.src = g.thumb;
  }

  const play = document.createElement("span");
  play.className = "play";
  play.textContent = "あそぶ";
  shot.appendChild(play);

  const info = document.createElement("div");
  info.className = "info";
  const h = document.createElement("h2");
  h.textContent = g.title;
  const p = document.createElement("p");
  p.textContent = g.desc || "";
  info.append(h, p);

  a.append(shot, info);
  grid.appendChild(a);
});
</script>
</body>
</html>
